name: Deploy to server

# Đơn giản: mỗi lần push lên main -> rsync code lên server + bật lại infra/dashboard.
# Bỏ qua deploy nếu commit message chứa [skip deploy].
#
# Cần tạo 3 secrets trong GitHub repo (Settings -> Secrets and variables -> Actions):
#   SERVER_HOST      vd 100.80.131.68 (IP Tailscale, runner cần join tailnet - xem chú thích bên dưới)
#   SERVER_USER      vd docutee
#   SERVER_PASSWORD  password SSH (cũng dùng cho sudo docker)
#
# LƯU Ý Tailscale: IP server là IP tailnet (100.x). GitHub runner mặc định KHÔNG
# vào được tailnet, nên cần join tailnet bằng Auth key
# (admin.tailscale.com -> Machines -> ... -> Keys -> Generate auth key):
#   TAILSCALE_AUTHKEY (secret trên GitHub).
# Không có secret này thì SSH tới IP tailnet sẽ fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lớp 1 — TEST: chạy toàn bộ unittest, đỏ thì deploy không bao giờ chạy.
  test:
    if: "!contains(github.event.head_commit.message, '[skip test]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12 (khớp server)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run unit tests (unittest, offline)
        run: python -m unittest discover -s tests -v

  # Lớp 2 — DEPLOY: chỉ chạy khi push thẳng lên main (PR chỉ test, không deploy).
  deploy:
    needs: [test]
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]') && (needs.test.result == 'success' || needs.test.result == 'skipped')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets (fail nhanh thay vì treo)
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SRV_HOST: ${{ secrets.SERVER_HOST }}
          SRV_USER: ${{ secrets.SERVER_USER }}
          SRV_PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          missing=0
          for v in "TS_AUTHKEY TAILSCALE_AUTHKEY" "SRV_HOST SERVER_HOST" "SRV_USER SERVER_USER" "SRV_PASS SERVER_PASSWORD"; do
            set -- $v; [ -n "${!1}" ] || { echo "::error::Thiếu secret $2"; missing=1; }
          done
          exit $missing

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Join tailnet with authkey
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=github-ci --accept-routes --timeout=60s

      - name: Install deploy tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Rsync code to server (xoá file đã bị remove khỏi repo)
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # --delete: file bị xoá/đổi tên trong repo PHẢI biến mất trên server.
          # Không có nó, các lần refactor trước để lại module cũ (itviec.py cạnh
          # itviec/, sources/__init__.py cũ import arxiv…) làm pipeline chết.
          # Loại trừ những thứ chỉ tồn tại trên server: .venv, data, logs và
          # 2 file secret (infra/.env, infra/CREDENTIALS.txt) — rsync không xoá
          # đường dẫn nằm trong --exclude.
          sshpass -e rsync -avz --delete --timeout=120 \
            --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='logs/' \
            --exclude='data/' \
            --exclude='infra/.env' \
            --exclude='infra/CREDENTIALS.txt' \
            --exclude='*.bak' \
            --exclude='*.tar.gz' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/mnt/kaggle_data/kaggle_pipeline/

      - name: Restart infra on server
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e
          cd /mnt/kaggle_data/kaggle_pipeline
          # quyền đọc cho container (uid 50000) — chỉ code, KHÔNG đụng infra/.env
          chmod -R a+rX dags pipeline scripts tests docs deploy infra/grafana 2>/dev/null || true
          chmod a+r infra/*.sql infra/*.yml infra/Dockerfile 2>/dev/null || true
          chmod 600 infra/.env 2>/dev/null || true
          # infra: postgres + grafana + airflow (docutee đã trong group docker nên không cần sudo)
          docker compose -f infra/docker-compose.yml up -d
          # venv trên host chỉ để chạy tay `python -m pipeline run ...` (pipeline thật chạy trong Airflow container)
          source .venv/bin/activate 2>/dev/null || python3 -m venv .venv
          pip install -q -r requirements.txt
          docker compose -f infra/docker-compose.yml ps
          EOF

      - name: Health check
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -s -o /dev/null -w 'grafana:%{http_code}\n' --max-time 20 http://localhost:3000/api/health; crontab -l | grep -c cron_daily.sh | sed 's/^/cron entries: /'"
