services:
  postgres:
    image: postgres:15-alpine
    container_name: kaggle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaggle_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_dev_2024}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d kaggle_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: kaggle_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      # Cho datasource provisioning (infra/grafana/provisioning/datasources/postgres.yml)
      # interpolate ${POSTGRES_*} — 1 nguồn sự thật duy nhất là infra/.env
      POSTGRES_DB: ${POSTGRES_DB:-kaggle_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_dev_2024}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy

  # ─── AIRFLOW (scheduler duy nhất, thay cron) ──────────────────────────────
  # Airflow chạy DAG dags/jobs_daily.py mỗi ngày 00:00 UTC (= 07:00 ICT).
  # Code pipeline được mount read-only vào container, chạy qua `python -m pipeline run`.
  # Truy cập UI: http://localhost:8080 (admin/admin, đổi qua env khi lên server).
  airflow-db:
    image: postgres:15-alpine
    container_name: kaggle_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.3-python3.12
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas beautifulsoup4 requests lxml kaggle psycopg2-binary playwright plotly pydantic tenacity"
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true"
    volumes:
      - ../dags:/opt/airflow/dags:ro
      - ..:/opt/airflow/kaggle_pipeline:ro
      - airflow_logs:/opt/airflow/logs

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.12
    container_name: kaggle_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow/kaggle_pipeline
      PROJECT_ROOT: /opt/airflow/kaggle_pipeline
      DATA_ROOT: /opt/airflow/data
      PIPELINE_PYTHON: python
      PIPELINE_LOAD_DB: "1"
      PIPELINE_SOURCES: ${PIPELINE_SOURCES:-itviec,topcv}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-kaggle_pipeline}
      DB_USER: ${POSTGRES_USER:-pipeline}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_dev_2024}
      # Kaggle push: lấy từ env của máy host (xem infra/.env.example).
      # Token mới (KGAT_...) đi vào KAGGLE_API_TOKEN — kaggle>=2.0 bắt buộc.
      # Chạy: export KAGGLE_API_TOKEN=... trước `docker compose up -d`,
      # hoặc ghi vào file infra/.env (KHÔNG commit file này).
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
      # Dataset id: KHÔNG set ở đây — để pipeline/settings.py tự build từ
      # KAGGLE_USERNAME (tránh env rỗng "" ghi đè default trong code).
      # Chỉ export ITVIEC/TOPCV_KAGGLE_DATASET khi muốn override hẳn id.
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas beautifulsoup4 requests lxml kaggle psycopg2-binary playwright plotly pydantic tenacity"
    volumes:
      - ../dags:/opt/airflow/dags:ro
      - ..:/opt/airflow/kaggle_pipeline:ro
      - ../data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    command: scheduler

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.12
    container_name: kaggle_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags:ro
      - ..:/opt/airflow/kaggle_pipeline:ro
      - airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  grafana_data:
  airflow_pgdata:
  airflow_logs:
