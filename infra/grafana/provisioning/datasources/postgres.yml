apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    # Giá trị lấy từ env của container grafana (xem infra/docker-compose.yml) —
    # đổi password chỉ cần sửa infra/.env, không sửa file này.
    url: postgres:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
