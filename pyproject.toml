[project]
name = "kaggle-pipeline"
version = "0.1.0"
description = "Vietnam IT Job Market Pipeline — Scrape → Process → Visualize → Publish"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Workflow: uv sync (dựng .venv từ uv.lock) — KHÔNG pip install thủ công.
# Thêm dep: sửa list dưới → uv lock → uv sync → uv export ... -o requirements.txt
# requirements.txt để pip trên server dùng (cron chạy bằng venv host); nguồn thật là
# file này + uv.lock. Scheduler là cron (scripts/cron_daily.sh) — không dùng Airflow.
dependencies = [
    "playwright>=1.40.0",
    # Backend browser cho topcv: Chromium patch fingerprint ở tầng C++ — cần để
    # vượt qua Cloudflare khi phân trang (Playwright bị chặn từ page 2).
    "cloakbrowser>=0.5",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "plotly>=5.18.0",
    "kaggle>=2.0",
    "lxml>=4.9.0",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
